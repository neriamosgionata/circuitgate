# Local override for smoke-testing the production stack without privileged
# ports, a public domain, or real mail. Swaps the Caddy site config for an
# HTTP-only one, points app-visible origins at this local URL, and routes
# mail to the Mailpit dev catcher.
#   docker compose up -d mailpit
#   docker compose -f compose.prod.yaml -f compose.local.yaml up -d
# Then open http://localhost:8080/login (mail at http://localhost:8025).
services:
  frontend:
    environment:
      ORIGIN: http://localhost:8080
  backend:
    environment:
      CIRCUITGATE_APP_BASE_URL: http://localhost:8080
      CIRCUITGATE_REALTIME_ALLOWED_ORIGINS: http://localhost:8080
      CIRCUITGATE_MAIL_MODE: smtp
      CIRCUITGATE_MAIL_FROM: no-reply@circuitgate.local
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_STARTTLS: "false"
  caddy:
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
