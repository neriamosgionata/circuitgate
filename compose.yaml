name: circuitgate

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: circuitgate
      POSTGRES_USER: circuitgate
      POSTGRES_PASSWORD: circuitgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuitgate -d circuitgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
