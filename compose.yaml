name: circuitgate

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: circuitgate
      POSTGRES_USER: circuitgate
      POSTGRES_PASSWORD: circuitgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuitgate -d circuitgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      CIRCUITGATE_DB_URL: jdbc:postgresql://db:5432/circuitgate
      CIRCUITGATE_DB_USERNAME: circuitgate
      CIRCUITGATE_DB_PASSWORD: circuitgate
      CIRCUITGATE_APP_BASE_URL: http://localhost:5173
      CIRCUITGATE_MAIL_MODE: smtp
      CIRCUITGATE_MAIL_FROM: no-reply@circuitgate.local
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_STARTTLS_ENABLE: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: oven/bun:1.4.2-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 5173"
    environment:
      # Vite's /api and /ws proxy targets the backend service in Compose, and
      # SvelteKit's server-side loads call the backend directly.
      CIRCUITGATE_API_PROXY_TARGET: http://backend:8080
      CIRCUITGATE_API_ORIGIN: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
