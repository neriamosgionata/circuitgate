name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 30
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: circuitgate
          POSTGRES_USER: circuitgate
          POSTGRES_PASSWORD: circuitgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U circuitgate -d circuitgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Start backend
        working-directory: backend
        env:
          CIRCUITGATE_MAIL_MODE: smtp
          CIRCUITGATE_MAIL_FROM: no-reply@circuitgate.test
          CIRCUITGATE_APP_BASE_URL: http://localhost:4173
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "1025"
        run: |
          ./mvnw --batch-mode --no-transfer-progress spring-boot:run \
            -Dspring-boot.run.profiles=local &
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:8080/api/auth/csrf > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become reachable on :8080" >&2
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Run end-to-end suite
        working-directory: frontend
        run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
