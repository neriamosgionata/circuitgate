# Production composition: frontend, backend, PostgreSQL, and a
# TLS-terminating Caddy reverse proxy. Copy `.env.example` to `.env`
# and set the required values before `docker compose -f compose.prod.yaml up -d`.
# See docs/operations.md.
name: circuitgate

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CIRCUITGATE_DB_NAME:-circuitgate}
      POSTGRES_USER: ${CIRCUITGATE_DB_USERNAME:-circuitgate}
      POSTGRES_PASSWORD: ${CIRCUITGATE_DB_PASSWORD:?set CIRCUITGATE_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CIRCUITGATE_DB_USERNAME:-circuitgate} -d ${CIRCUITGATE_DB_NAME:-circuitgate}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      CIRCUITGATE_DB_URL: jdbc:postgresql://db:5432/${CIRCUITGATE_DB_NAME:-circuitgate}
      CIRCUITGATE_DB_USERNAME: ${CIRCUITGATE_DB_USERNAME:-circuitgate}
      CIRCUITGATE_DB_PASSWORD: ${CIRCUITGATE_DB_PASSWORD:?set CIRCUITGATE_DB_PASSWORD in .env}
      CIRCUITGATE_APP_BASE_URL: ${CIRCUITGATE_APP_BASE_URL:?set CIRCUITGATE_APP_BASE_URL in .env}
      CIRCUITGATE_REMEMBER_ME_KEY: ${CIRCUITGATE_REMEMBER_ME_KEY:?set CIRCUITGATE_REMEMBER_ME_KEY in .env}
      CIRCUITGATE_TRUSTED_PROXIES: ${CIRCUITGATE_TRUSTED_PROXIES:-172.16.0.0/12}
      CIRCUITGATE_REALTIME_ALLOWED_ORIGINS: ${CIRCUITGATE_APP_BASE_URL:?set CIRCUITGATE_APP_BASE_URL in .env}
      CIRCUITGATE_MAIL_MODE: ${CIRCUITGATE_MAIL_MODE:-smtp}
      CIRCUITGATE_MAIL_FROM: ${CIRCUITGATE_MAIL_FROM:?set CIRCUITGATE_MAIL_FROM in .env}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST in .env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/auth/csrf || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      ORIGIN: ${CIRCUITGATE_APP_BASE_URL:?set CIRCUITGATE_APP_BASE_URL in .env}
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CIRCUITGATE_DOMAIN: ${CIRCUITGATE_DOMAIN:?set CIRCUITGATE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
